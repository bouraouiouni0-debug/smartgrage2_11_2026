<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 CAM CONTROL</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#38bdf8}
.card{background:#1e293b;padding:20px;margin-top:18px;border-radius:14px}
button{width:100%;padding:15px;margin-top:12px;background:#0284c7;border:none;color:#fff;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
button:active{background:#0369a1}
input{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;font-size:16px}
#photo{width:100%;margin-top:15px;border-radius:10px;display:none}
#messages{background:#0f172a;min-height:150px;max-height:250px;overflow-y:auto;padding:12px;border-radius:8px;margin-top:10px;overflow-wrap:anywhere}
.msg{padding:10px;margin-bottom:8px;background:#334155;border-radius:7px}
.sent{border-left:4px solid #38bdf8}
.received{border-left:4px solid #4ade80}
#app{display:none}
#denied{display:none;max-width:400px;margin:80px auto;text-align:center}
#denied h2{color:#f87171}
</style>
</head>
<body>

<!-- Affiché si le mot de passe est faux -->
<div id="denied">
  <h2>🔒 Mot de passe incorrect</h2>
  <button onclick="login()">Réessayer</button>
</div>

<!-- Cachée tant que le mot de passe n'est pas validé -->
<div id="app">
<div class="container">
<h1>ESP32-CAM CONTROL</h1>

<div class="card">
  <h3>📷 CAMERA</h3>
  <button onclick="takePhoto()">TAKE A PHOTO</button>
  <img id="photo" alt="Photo">
</div>

<div class="card">
  <h3>📤 SEND MESSAGE TO ESP32</h3>
  <input id="messageInput" type="text" placeholder="Write your message...">
  <button onclick="sendMessage()">SEND MESSAGE</button>
</div>

<div class="card">
  <h3>🔢 COUNTER 0 → 10 (automatique)</h3>
  <div id="counterValue" style="font-size:40px;text-align:center;margin-top:10px">0</div>
</div>

<div class="card">
  <h3>📥 RECEIVE MESSAGES FROM ESP32</h3>
  <div id="messages"></div>
</div>
</div>
</div>

<script>
let H = {};
let started = false;

// Vérifie une clé auprès du serveur
async function checkKey(k) {
  try {
    const r = await fetch("/api/check", { headers: { "x-user-key": k } });
    return r.ok;
  } catch (e) {
    return false;
  }
}

function grantAccess(k) {
  H = { "Content-Type": "application/json", "x-user-key": k };
  sessionStorage.setItem("k", k);
  document.getElementById("denied").style.display = "none";
  document.getElementById("app").style.display = "block";
  start();
}

function showDenied() {
  sessionStorage.removeItem("k");
  document.getElementById("app").style.display = "none";
  document.getElementById("denied").style.display = "block";
}

async function login() {
  const k = prompt("Mot de passe :");
  if (k !== null && await checkKey(k)) grantAccess(k);
  else showDenied();
}

function addMessage(text, type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.textContent = text;
  const box = document.getElementById("messages");
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function takePhoto() {
  addMessage("Photo demandée...", "sent");
  try {
    const before = (await (await fetch("/api/photo-time", { headers: H })).json()).t;
    await fetch("/api/capture", { method: "POST", headers: H });
    for (let i = 0; i < 30; i++) {            // attend jusqu'à ~30 s
      await new Promise(r => setTimeout(r, 1000));
      const t = (await (await fetch("/api/photo-time", { headers: H })).json()).t;
      if (t !== before) {
        const blob = await (await fetch("/api/photo?t=" + t, { headers: H })).blob();
        const img = document.getElementById("photo");
        if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
        img.dataset.url = URL.createObjectURL(blob);
        img.src = img.dataset.url;
        img.style.display = "block";
        addMessage("Photo reçue !", "received");
        return;
      }
    }
    addMessage("Pas de réponse de l'ESP32", "received");
  } catch (e) { addMessage("Erreur photo : " + e.message, "received"); }
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const msg = input.value.trim();
  if (!msg) return;
  try {
    await fetch("/api/send", { method: "POST", headers: H, body: JSON.stringify({ msg }) });
    addMessage("YOU: " + msg, "sent");
    input.value = "";
  } catch (e) { addMessage("Erreur : " + e.message, "received"); }
}

document.getElementById("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

async function receiveMessages() {
  try {
    const r = await fetch("/api/messages", { headers: H });
    if (!r.ok) return;
    (await r.json()).forEach(m => addMessage("ESP32: " + m, "received"));
  } catch (e) {}
}

let counter = 0;
async function autoCounter() {
  try {
    const r = await fetch("/api/send", {
      method: "POST",
      headers: H,
      body: JSON.stringify({ msg: String(counter) })
    });
    if (!r.ok) return;
    document.getElementById("counterValue").textContent = counter;
    counter = (counter >= 10) ? 0 : counter + 1;   // retour à 0 après 10
  } catch (e) {}
}

// Les boucles ne démarrent qu'après un mot de passe correct
function start() {
  if (started) return;
  started = true;
  setInterval(receiveMessages, 1000);
  setInterval(autoCounter, 1000);
}

// Au chargement : réutilise la clé de l'onglet si elle est valide, sinon demande le mot de passe
(async function init() {
  const saved = sessionStorage.getItem("k");
  if (saved && await checkKey(saved)) grantAccess(saved);
  else login();
})();
</script>
</body>
</html>
