<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 CAM CONTROL</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#38bdf8}
.card{background:#1e293b;padding:20px;margin-top:18px;border-radius:14px}
button{width:100%;padding:15px;margin-top:12px;background:#0284c7;border:none;color:#fff;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
button:active{background:#0369a1}
input{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;font-size:16px}
#photo{width:100%;margin-top:15px;border-radius:10px;display:none}
#messages{background:#0f172a;min-height:150px;max-height:250px;overflow-y:auto;padding:12px;border-radius:8px;margin-top:10px;overflow-wrap:anywhere}
.msg{padding:10px;margin-bottom:8px;background:#334155;border-radius:7px}
.sent{border-left:4px solid #38bdf8}
.received{border-left:4px solid #4ade80}
#app{display:none}
#denied{display:none;max-width:400px;margin:80px auto;text-align:center}
#denied h2{color:#f87171}
</style>
</head>
<body>

<div id="denied">
  <h2>🔒 Mot de passe incorrect</h2>
  <button onclick="login()">Réessayer</button>
</div>

<div id="app">
<div class="container">
<h1>ESP32-CAM CONTROL</h1>

<div class="card">
  <h3>📷 CAMERA</h3>
  <button onclick="takePhoto()">TAKE A PHOTO</button>
  <img id="photo" alt="Photo">
</div>

<div class="card">
  <h3>📤 SEND MESSAGE TO ESP32</h3>
  <input id="messageInput" type="text" placeholder="Write your message...">
  <button onclick="sendMessage()">SEND MESSAGE</button>
</div>

<div class="card">
  <h3>🔢 COUNTER 0 → 10 (automatique)</h3>
  <div id="counterValue" style="font-size:40px;text-align:center;margin-top:10px">0</div>
</div>

<div class="card">
  <h3>📥 RECEIVE MESSAGES FROM ESP32</h3>
  <div id="messages"></div>
</div>
</div>
</div>

<script>
let H = {};
let started = false;

async function checkKey(k) {
  try {
    const r = await fetch("/api/check", { headers: { "x-user-key": k } });
    return r.ok;
  } catch (e) {
    return false;
  }
}

function grantAccess(k) {
  H = { "Content-Type": "application/json", "x-user-key": k };
  sessionStorage.setItem("k", k);
  document.getElementById("denied").style.display = "none";
  document.getElementById("app").style.display = "block";
  start();
}

function showDenied() {
  sessionStorage.removeItem("k");
  document.getElementById("app").style.display = "none";
  document.getElementById("denied").style.display = "block";
}

async function login() {
  const k = prompt("Mot de passe :");
  if (k !== null && await checkKey(k)) grantAccess(k);
  else showDenied();
}
